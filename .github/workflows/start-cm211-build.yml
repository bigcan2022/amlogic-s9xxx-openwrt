name: Start CM211 ImmortalWrt build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/start-cm211-build.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch upstream build workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-openwrt-system-image.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f source_branch=immortalwrt_master \
            -f openwrt_board=s905l3b \
            -f openwrt_kernel=6.12.y \
            -f auto_kernel=true \
            -f kernel_repo=ophub/kernel \
            -f kernel_usage=stable \
            -f openwrt_ip=192.168.1.2 \
            -f use_ccache=true \
            -f openwrt_storage=save \
            -f builder_name=yourname
